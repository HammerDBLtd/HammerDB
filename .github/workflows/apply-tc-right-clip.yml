name: Apply transaction counter right-edge clipping fix

on:
  push:
    branches:
      - fix-tc-graph-clipping

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-tc-graph-clipping

      - name: Apply right-edge clipping fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("modules/emu_graph-2.0.tm")
          text = path.read_text()
          old = """        set coordscopy2 [ lreplace $coords end-1 end ]
        set coordscopy2 [ lreplace $coordscopy2 0 1 ]
"""
          new = """        set coordscopy2 [ lreplace $coords end-1 end ]
        set coordscopy2 [ lreplace $coordscopy2 0 1 ]
        #Keep the 5 pixel graph stroke inside the right plot boundary
        lset coordscopy2 end-1 [ expr {[lindex $coordscopy2 end-1] - [pad_stroke]} ]
"""
          if old not in text:
              raise SystemExit("target block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/emu_graph-2.0.tm
          git commit -m "Fix transaction counter right-edge clipping [skip ci]"
          git push origin HEAD:fix-tc-graph-clipping
